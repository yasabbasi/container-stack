name: apply

on:
  push:
    branches: [main]
    paths:
      - terraform/**
  # By hand, for the first run after the bootstrap. Google refuses any branch but main.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    # The job waits here until the owner approves it. Only then does Google accept its sign-in.
    environment: production
    defaults:
      run:
        working-directory: terraform/google
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_github_repository: ${{ github.repository }}
      # Named here so that GitHub masks them wherever Terraform prints them.
      MASKED_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
      MASKED_EMAIL: ${{ secrets.OWNER_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PRODUCTION }}
          service_account: terraform-apply@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"
      # The summary holds whole lines only, so a masked value is never cut in two.
      - run: |
          set +e
          terraform apply -input=false -auto-approve -no-color 2>&1 | tee apply.txt
          status=${PIPESTATUS[0]}
          { echo '```text'; tail -n 500 apply.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        shell: bash
