name: check

# Reads the Google Cloud project's setup as the read-only reader identity. The output goes to
# the run's log and summary, which are public, so the commands are a fixed list: a free-text
# command could be made to print a credential.
on:
  workflow_dispatch:
    inputs:
      what:
        description: What to read
        required: true
        type: choice
        options:
          - project
          - services
          - identities
          - access
          - claude-quotas
          - quota-requests

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Google accepts this sign-in only from this file as it is on main.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: reader@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - env:
          WHAT: ${{ inputs.what }}
          CLOUDSDK_CORE_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          # Named here so that GitHub masks them wherever a command prints them.
          MASKED_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
          MASKED_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: |
          look() {
            case "$WHAT" in
              project)
                gcloud projects describe "$CLOUDSDK_CORE_PROJECT" \
                  --format 'value(lifecycleState,createTime)'
                ;;
              services) gcloud services list --enabled --format 'value(config.name)' ;;
              identities) gcloud iam service-accounts list --format 'table(email,disabled)' ;;
              access)
                gcloud projects get-iam-policy "$CLOUDSDK_CORE_PROJECT" \
                  --flatten 'bindings[].members' --format 'table(bindings.role,bindings.members)'
                ;;
              claude-quotas)
                gcloud quotas info list --service aiplatform.googleapis.com \
                  --project "$CLOUDSDK_CORE_PROJECT" --format json |
                  jq '[.[] | select(tostring | test("global_online_prediction"))]'
                ;;
              quota-requests)
                # The contact email and the justification are left out.
                gcloud quotas preferences list --project "$CLOUDSDK_CORE_PROJECT" \
                  --format 'json(name,service,quotaId,dimensions,quotaConfig,reconciling,updateTime)'
                ;;
              *)
                echo "unknown choice: $WHAT"
                return 1
                ;;
            esac
          }
          # The summary holds whole lines only, so a masked value is never cut in two.
          set +e
          look 2>&1 | tee check.txt
          status=${PIPESTATUS[0]}
          { echo '```text'; head -n 500 check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        shell: bash
